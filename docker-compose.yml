version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sakid-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sakid_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sakid-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
